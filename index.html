function ok_(msg){ ruToast(msg); if(window.__cb) window.__cb({success:true,message:msg}); }
/* ====== MODE KONEKSI OTOMATIS ======
 * 1) Dibuka dari Apps Script        → google.script.run asli (tidak lewat sini).
 * 2) Di-hosting statis (GitHub dsb) → bridge fetch POST ke Web App Apps Script.
 *     ▶ Isi API_URL dengan URL deploymen Web App (.exec) yang aksesnya "Siapa saja":
 *       var API_URL = 'https://script.google.com/macros/s/XXXX/exec';
 *     Lalu copy-paste kode doPost + RPC_WHITELIST (ada di code.gs) ke Apps Script Anda.
 * 3) API_URL kosong                 → mode DEMO (data contoh, untuk tes tampilan). */
var API_URL = '';
var KNOWN_RPC = ['getDashboard','getReports','saveTransaction','deleteTransaction','saveAccount','deleteAccount','saveGoal','adjustGoal','deleteGoal','saveBudget','saveUserSettings','exportReportCsv'];
function makeBridgeRunner(url){
  var r = { ok:null, err:null };
  r.withSuccessHandler = function(cb){ r.ok = cb; return r; };
  r.withFailureHandler = function(cb){ r.err = cb; return r; };
  KNOWN_RPC.forEach(function(fn){
    r[fn] = function(){
      var args = Array.prototype.slice.call(arguments);
      fetch(url, { method:'POST', body: JSON.stringify({ fn: fn, args: args }) })
        .then(function(res){ return res.json(); })
        .then(function(json){
          if (json && json.ok){ if (r.ok) r.ok(json.data); }
          else if (r.err) r.err({ message:(json && json.message) || 'Respon tidak valid dari server' });
        })
        .catch(function(e){ if (r.err) r.err({ message:String(e) }); });
    };
  });
  return r;
}
if (typeof google === 'undefined') {
  if (API_URL) {
    // Hosting statis + Web App live
    window.google = { script:{ run: makeBridgeRunner(API_URL) } };
  } else {
    // Mode DEMO (data contoh dari PRE_DASH/PRE_REP di atas)
    var shimRunner = { withSuccessHandler:function(cb){ window.__cb = cb; return this; }, withFailureHandler:function(cb){ return this; } };
    Object.keys(SHIM).forEach(function(k){ shimRunner[k] = SHIM[k]; });
    window.google = { script:{ run: shimRunner } };
  }
}

function fmtRp(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function fmtIDR(n){ return (n||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' IDR'; }
function fmtShort(n){ n=Math.abs(n||0);
  if(n>=1e12) return (n/1e12).toLocaleString('id-ID',{maximumFractionDigits:2})+' T';
  if(n>=1e9)  return (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(n>=1e6)  return (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+' jt';
  if(n>=1e3)  return (n/1e3).toLocaleString('id-ID',{maximumFractionDigits:1})+' rb';
  return String(Math.round(n)); }
function monthLabel(k){ if(!k) return '—'; return M_ID[Number(k.substring(5,7))-1]+' '+k.substring(0,4); }
function dateLabel(iso){ if(!iso) return '-'; var p=iso.split('-'); return Number(p[2])+' '+M_FULL[Number(p[1])-1]+' '+p[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function icon(path,cls){ return '<svg class="'+(cls||'w-4 h-4')+'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="'+path+'" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function catEmoji(c){
  var m={'Makanan & Jajan':'🍱','Transportasi':'🚌','Belanja':'🛒','Tagihan & Utilitas':'⚡','Hiburan':'🎮','Kesehatan':'💊','Pendidikan':'🎓','Gaji & Bonus':'💼','Investasi & Tabungan':'📈','Sewa/Kost':'🏠','Donasi':'🤲','Bunga & Cashback':'✨','Transfer Antar Akun':'🔁','Lainnya':'📦'};
  return m[c]||'📦';
}
function ruToast(msg){
  var t=document.getElementById('toastEl');
  document.getElementById('toastMsg').innerHTML=esc(msg||'Berhasil');
  t.classList.add('show');
  clearTimeout(ruToast._t); ruToast._t=setTimeout(function(){ t.classList.remove('show'); },2600);
}
function debounceSearch(){
  clearTimeout(debounceSearch._t);
  debounceSearch._t=setTimeout(function(){
    var i=document.getElementById('globalSearch');
    S.search=i?i.value:'';
    S.page=1; load();
  },420);
}
var errHandler=function(e){ loadingDone(); ruToast('Gagal: '+(e&&e.message?e.message:e)); };
function rpcCall(name,args,cb){
  document.body.classList.add('opacity-70');
  google.script.run
    .withSuccessHandler(function(res){ document.body.classList.remove('opacity-70'); cb(res); })
    .withFailureHandler(function(e){ document.body.classList.remove('opacity-70'); errHandler(e); })
  [name].apply(google.script.run,args||[]);
}
function loadingDone(){ document.body.classList.remove('opacity-70'); }
function afterMutate(res){
  if(res&&res.success){ closeModal(); ruToast(res.message||'Berhasil'); S.rep=null; load(); }
  else { ruToast((res&&res.message)||'Gagal'); }
}

/* ================= NAVIGASI ================= */
function renderNav(){
  var side='',bottom='';
  ['home','tx','budget','target','akun'].forEach(function(p){
    var i=PAGES[p];
    side+='<div class="side-item '+(S.path===p?'active':'')+'" onclick="go(\''+p+'\')">'+icon(i[1],'w-4 h-4')+'<span>'+i[0]+'</span></div>';
  });
  // 5 slot: Beranda | Transaksi | [+ FAB] | Target | Akun — tombol + menyatu di nav bar
  ['home','tx',null,'target','akun'].forEach(function(p){
    if(p===null){
      bottom+='<button id="navFab" onclick="toggleFab(true)" aria-label="Tambah transaksi" class="nav-fab flex-none" >'
        +'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>';
      return;
    }
    var i=PAGES[p];
    bottom+='<button class="nav-item '+(S.path===p?'active':'')+'" onclick="go(\''+p+'\')">'+icon(i[1],'w-5 h-5')+'<span>'+i[0]+'</span></button>';
  });
  document.getElementById('sideNav').innerHTML=side;
  document.getElementById('bottomNav').innerHTML=bottom;
}
function go(path){
  S.path=path; S.page=1; renderNav(); window.scrollTo({top:0});
  load();
}
function changeMonth(v){ S.month=v; S.page=1; load(); }

/* ================= LOAD ================= */
function load(){
  rpcCall('getDashboard',[S.month||'',S.page,S.limit,S.search,S.type,S.akun],function(res){
    S.data=res; S.month=res.month;
    syncMonthSelect(res);
    render();
    loadingDone();
    // Grafik perbandingan 12 bulan di Beranda — ambil data laporan bila belum ada / beda tahun
    if(S.path==='home'&&(!S.rep||S.rep.year!==Number(res.month.substring(0,4)))){
      rpcCall('getReports',[Number(res.month.substring(0,4))],function(r2){
        S.rep=r2; S.y=r2.year;
        if(S.path==='home'&&S.data){ drawHomeCharts(); }
        loadingDone();
      });
    }
  });
}
function syncMonthSelect(res){
  var sel=document.getElementById('monthSelect');
  var set={}; (res.availableMonths||[]).forEach(function(m){ set[m]=1; });
  if(S.month) set[S.month]=1;
  var keys=Object.keys(set).sort().reverse();
  sel.innerHTML=keys.map(function(m){ return '<option value="'+m+'" '+(m===S.month?'selected':'')+'></option>'; }).join('');
  document.getElementById('monthLabel').textContent=monthLabel(S.month);
}
function render(){
  renderNav();
  document.getElementById('sideUser').textContent=S.data.user||'Hanan';
  var w=document.getElementById('pageWrap');
  w.className='max-w-5xl mx-auto md:max-w-4xl px-4 md:px-8 pt-4 space-y-4 anim-in';
  var html='';
  if(S.path==='home') html=vHome();
  else if(S.path==='akun') html=vAkun();
  else if(S.path==='tx') html=vTx();
  else if(S.path==='target') html=vTarget();
  else if(S.path==='budget') html=vBudget();
  else html=vHome();
  w.innerHTML=html;
  if(S.path==='home'){ drawHomeCharts(); }
}

function txListHtml(d,noPage){
  var html='';
  if(!d.transactions.length){
    var reason=(S.type!=='All'||S.search||S.akun!=='All')?'dengan filter ini':'untuk bulan ini';
    html+='<div class="text-center py-8">'
      + icon('M4 7h16M4 12h16M4 18h10','w-9 h-9 mx-auto text-zinc-600')
      +'<div class="font-bold text-zinc-300 mt-2">Tidak ada transaksi</div>'
      +'<div class="text-[11px] text-zinc-500 max-w-[230px] mx-auto mt-1">Anda tidak memiliki transaksi '+reason+'. Tambahkan dengan tombol + di bawah.</div>'
      +'</div>';
    return html;
  }
  var groups={};
  d.transactions.forEach(function(t){ (groups[t.tanggal]=groups[t.tanggal]||[]).push(t); });
  var WD=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  Object.keys(groups).sort().reverse().forEach(function(tg){
    var mi=0,ke=0;
    groups[tg].forEach(function(t){ if(t.tipe==='Masuk') mi+=t.nominal; else if(t.tipe==='Keluar') ke+=t.nominal; });
    var wd='';
    try{ wd=WD[new Date(tg+'T00:00:00').getDay()]; }catch(e){}
    html+='<div class="mt-2"><div class="flex items-center justify-between px-1.5 mb-1">'
      +'<span class="text-[10px] font-bold text-zinc-400">'+(wd?wd+', ':'')+esc(dateLabel(tg))+'</span>'
      +'<span class="text-[10px] font-bold"><i class="not-italic text-teal-400">'+(mi?'+':'')+(mi?fmtShort(mi)+' ':'')+'</i>'
      +(ke?'<i class="not-italic text-rose-400">'+(mi?' ':'')+'−'+fmtShort(ke)+'</i>':'')+'</span></div>';
    groups[tg].forEach(function(t){ html+=txRow(t); });
    html+='</div>';
  });
  html+=(noPage===true)?'<div class="text-center text-[10px] text-zinc-600 mt-2">semua transaksi akun ini</div>':paginationHtml(d);
  return html;
}
function txRow(t){
  var isMasuk=(t.tipe==='Masuk');
  var col=isMasuk?'text-teal-400':(t.tipe==='Transfer'?'text-[#9b8cff]':'text-rose-400');
  var SecondLine='';
  var accN=t.akunNama||t.akun||'';
  if(t.tipe==='Transfer'){
    SecondLine=(t.waktu||'')+' • '+esc(accN)+' → '+esc(t.akunTujuanNama||t.akunTujuan||'');
  } else {
    SecondLine=(t.waktu||'')+' • '+esc(accN)+(t.kategori?' • '+esc(t.kategori):'');
  }
  var amountPrefix=isMasuk?'+':(t.tipe==='Transfer'?'':'−');
  return '<div class="tx-row" data-id="'+esc(t.id)+'">'
    +'<div class="w-9 h-9 rounded-full flex items-center justify-center text-base flex-none" style="background:#1d1d22">'+catEmoji(t.kategori)+'</div>'
    +'<div class="min-w-0 flex-1"><div class="text-[13px] font-semibold truncate">'+esc(t.deskripsi)+'</div>'
    +'<div class="text-[10px] text-zinc-500 truncate">'+SecondLine+'</div></div>'
    +'<div class="text-right flex-none"><div class="text-[13px] font-extrabold '+col+'">'+amountPrefix+fmtShort(t.nominal)+'</div><div class="text-[9px] text-zinc-500">'+t.nominal.toLocaleString('id-ID')+'</div></div>'
    +'<button class="cbtn p-1.5 text-zinc-500 hover:!text-teal-400 flex" onclick="openTx(\''+t.tipe+'\',\''+esc(t.id)+'\')">'+'<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" stroke-linecap="round" stroke-linejoin="round"/></svg>'+'</button>'
    +'<button class="cbtn p-1.5 text-zinc-500 hover:!text-rose-400 flex" onclick="confirmDelTx(\''+esc(t.id)+'\')">'+'<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" stroke-linecap="round" stroke-linejoin="round"/></svg>'+'</button>'
    +'</div>';
}

  var html='<div class="flex items-center justify-between pt-1"><div><h2 class="text-lg font-extrabold">Budget Bulanan</h2><p class="text-[10px] text-zinc-500 mt-0.5">Batas belanja per kategori bulan '+esc(monthLabel(d.month))+' — merah berarti melebihi.</p></div><button onclick="openBudget(\'\')" class="btn-p text-xs px-3.5 py-2">+ Budget</button></div>';
  html+='<div class="grid grid-cols-3 gap-2">'
    +'<div class="card p-3 text-center"><div class="text-[9px] text-zinc-500 font-bold">TOTAL BUDGET</div><div class="font-extrabold text-[13px] mt-0.5">'+fmtRp(tot)+'</div></div>'
    +'<div class="card p-3 text-center"><div class="text-[9px] text-zinc-500 font-bold">TERPAKAI</div><div class="font-extrabold text-[13px] mt-0.5 text-rose-400">'+fmtRp(useTotal)+'</div></div>'
    +'<div class="card p-3 text-center"><div class="text-[9px] text-zinc-500 font-bold">KAT. LEBIH</div><div class="font-extrabold text-[13px] mt-0.5 text-amber-400">'+over+'</div></div></div>';
  if(!d.budgets.length){
    html+='<div class="card p-8 text-center"><div class="text-3xl mb-2">🧮</div><div class="font-bold">Belum ada budget</div><div class="text-[11px] text-zinc-500 mt-1">Atur batas per kategori, misal: Makanan & Jajan — Rp 1.200.000</div></div>';
  }
  html+='<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">';
  d.budgets.forEach(function(b){
    var pct=b.budget>0?Math.round(b.terpakai/b.budget*100):0;
    var danger=b.terpakai>b.budget;
    var warn=!danger&&pct>=80;
    var col=danger?'#f43f5e':(warn?'#f59e0b':'#2ecc71');
    var sisa=b.budget-b.terpakai;
    html+='<div class="card p-4">'
      +'<div class="flex items-center justify-between"><div class="flex items-center gap-2.5 min-w-0"><span class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-lg flex-none">'+catEmoji(b.kategori)+'</span><div class="min-w-0"><div class="font-bold text-sm truncate">'+esc(b.kategori)+'</div><div class="text-[10px] text-zinc-500 truncate">'+fmtRp(b.terpakai)+' dari '+fmtRp(b.budget)+'</div></div></div><span class="font-extrabold text-xs flex-none" style="color:'+col+'">'+pct+'%</span></div>'
      +'<div class="bar mt-3"><div style="width:'+Math.min(pct,100)+'%;background:'+col+'"></div></div>'
      +'<div class="flex items-center justify-between mt-2"><span class="text-[10px] '+(danger?'text-rose-400 font-bold':'text-zinc-500')+'">'+(danger?'⚠ Melebihi anggaran!':'Sisa '+fmtRp(Math.max(0,sisa)))+'</span>'
      +'<span><button onclick="openBudget(\''+esc(b.kategori)+'\')" class="px-2 py-1 text-[10px] rounded-lg bg-white/5 text-zinc-400">✏️</button> <button onclick="delBudget(\''+esc(b.kategori)+'\')" class="px-2 py-1 text-[10px] rounded-lg bg-rose-500/10 text-rose-400">🗑</button></span></div></div>';
  });
  html+='</div>';
  return html;
}

/* ================= GRAFIK BERANDA ================= */
function mapEntries(m){
  var e=[];
  for(var k in m){ e.push([k,m[k]]); }
  e.sort(function(a,b){ return b[1]-a[1]; });
  return e;
}
function catColor(name){
  var d=S.data;
  if(!d||!d.categories) return '#64748b';
  var i=d.categories.indexOf(name);
  if(i<0) return '#64748b';
  return d.catColors[i]||'#64748b';
}
function catLegendHtml(entries){
  if(!entries.length) return '<div class="text-center text-[10px] text-zinc-600 mt-2">Belum ada pengeluaran bulan ini</div>';
  return '<div class="flex flex-wrap gap-x-3 gap-y-1 mt-3">'+entries.slice(0,7).map(function(e){
    return '<span class="flex items-center gap-1.5 text-[10px] text-zinc-400"><i class="w-2 h-2 rounded-full inline-block" style="background:'+catColor(e[0])+'"></i>'+esc(e[0])+' — '+fmtShort(e[1])+'</span>';
  }).join('')+'</div>';
}
function drawHomeCharts(){
  var d=S.data;
  if(!d||S.path!=='home') return;
  ['chComp','chDaily','chDonut'].forEach(function(k){ if(CH[k]){ CH[k].destroy(); delete CH[k]; } });
  var grid={color:'rgba(255,255,255,0.05)'};
  var tick={color:'#8b8f96',font:{size:10}};
  var legend={labels:{color:'#9ca3af',boxWidth:10,font:{size:10}}};
  // 1) Perbandingan antar bulanan (12 bulan) — bar masuk vs keluar
  var cc=document.getElementById('chComp');
  if(cc&&S.rep){
    CH.chComp=new Chart(cc.getContext('2d'),{ type:'bar',
      data:{ labels:S.rep.labels, datasets:[
        {label:'Masuk', data:S.rep.masuk.map(Math.round), backgroundColor:'#2dd4bf', borderRadius:4},
        {label:'Keluar', data:S.rep.keluar.map(Math.round), backgroundColor:'#f43f5e', borderRadius:4}]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:legend},
        scales:{x:{grid:grid,ticks:tick},y:{grid:grid,ticks:tick}}} });
  }
  // 2) Harian bulan terpilih
  var cd=document.getElementById('chDaily');
  if(cd&&d.chartDaily&&d.chartDaily.labels.length){
    CH.chDaily=new Chart(cd.getContext('2d'),{ type:'line',
      data:{ labels:d.chartDaily.labels, datasets:[
        {label:'Masuk', data:d.chartDaily.masuk, borderColor:'#2dd4bf', backgroundColor:'rgba(45,212,191,.12)', tension:.3, fill:true, pointRadius:0},
        {label:'Keluar', data:d.chartDaily.keluar, borderColor:'#f43f5e', backgroundColor:'rgba(244,63,94,.08)', tension:.3, fill:true, pointRadius:0}]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:legend},
        scales:{x:{grid:grid,ticks:{color:'#8b8f96',font:{size:9},maxTicksLimit:10}},y:{grid:grid,ticks:tick}}} });
  }
  // 3) Distribusi pengeluaran bulan ini (donut) + legend
  var entries=mapEntries(d.catSpent||{});
  var lg=document.getElementById('donutLegend');
  if(lg) lg.innerHTML=catLegendHtml(entries);
  var dn=document.getElementById('chDonut');
  if(dn){
    if(!entries.length){
      dn.closest('.card').querySelector('canvas').style.display='none';
    } else {
      CH.chDonut=new Chart(dn.getContext('2d'),{ type:'doughnut',
        data:{ labels:entries.map(function(e){ return e[0]; }),
          datasets:[{ data:entries.map(function(e){ return Math.round(e[1]); }), borderWidth:0,
            backgroundColor:entries.map(function(e){ return catColor(e[0]); })}]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
          plugins:{ legend:{ display:false } } } });
    }
  }
}

    +'<div><label class="lbl">Catatan (opsional)</label><input name="catatan" class="inp" placeholder="detail tambahan" value="'+(t?esc(t.catatan):'')+'"></div>'

    S.data=res; S.month=res.month; syncMonthSelect(res); renderNav();
    openModal('<div class="card w-full md:max-w-sm sheet p-5">'
      +'<h3 class="font-extrabold text-lg mb-3">⚙️ Pengaturan</h3>'
      +'<form id="stForm" class="space-y-3"><div><label class="lbl">Nama Anda</label><input name="nama" class="inp" value="'+esc(res.user)+'"></div>'
      +'<div class="text-[11px] text-zinc-500 card p-2.5 leading-relaxed">Database: Google Spreadsheet.<br>Sheet: Akun · Transaksi · Goals · Budget · Pengaturan</div>'
      +'<button type="submit" class="btn-p w-full py-2.5 text-sm">Simpan</button></form>'
      +'<div class="mt-3 pt-3 border-t border-white/5"><button onclick="quickExport()" class="btn-g w-full py-2.5 text-sm">⬇ Ekspor CSV '+esc(monthLabel(S.month))+'</button></div>'
      +'<button onclick="closeModal()" class="w-full mt-2 text-xs text-zinc-500 py-2">Tutup</button></div>');
    document.getElementById('stForm').addEventListener('submit',function(e){
      e.preventDefault();
      google.script.run.withSuccessHandler(function(res){
        closeModal(); ruToast(res.message||'Tersimpan');
        rpcCall('getDashboard',[S.month,1,15,S.search,S.type,S.akun],function(d2){
          S.data=d2; S.month=d2.month; syncMonthSelect(d2); render(); loadingDone();
        });
      }).withFailureHandler(errHandler).saveUserSettings({nama:e.target.elements.nama.value.trim()||'Hanan'});
    });
    loadingDone();
  });
}
function quickExport(){
  ruToast('Menyiapkan CSV…');
  google.script.run.withSuccessHandler(function(res){
    if(res.success&&res.csvData){
      var blob=new Blob(["\ufeff"+res.csvData],{type:'text/csv;charset=utf-8;'});
      var url=URL.createObjectURL(blob);
      var aEl=document.createElement('a');
      aEl.href=url;
      aEl.download='HANAN_UANG_'+(S.month||'laporan')+'.csv';
      document.body.appendChild(aEl); aEl.click(); document.body.removeChild(aEl);
      ruToast('Laporan diunduh!');
    } else {
      ruToast(res.message||'Tidak ada data.');
    }
  }).withFailureHandler(errHandler).exportReportCsv(S.month||'');
}

/* ================= MODAL & FAB ================= */
function openModal(inner){
  document.getElementById('modalHost').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()">'+inner+'</div>';
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function toggleFab(open){
  var ov=document.getElementById('fabOverlay'), mn=document.getElementById('fabMenu'), fb=document.getElementById('fabBtn');
  if(open){
    ov.classList.remove('hidden'); mn.classList.remove('hidden'); fb.classList.add('opacity-0','pointer-events-none');
  } else {
    ov.classList.add('hidden'); mn.classList.add('hidden'); fb.classList.remove('opacity-0','pointer-events-none');
  }
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeModal(); toggleFab(false); } });
