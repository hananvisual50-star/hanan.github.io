<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <!-- ==== PWA iOS (Safari hanya membaca manifest FILE asli + ikon PNG) ==== -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HANAN.UANG">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <title>HANAN.UANG — Keuangan Pribadi</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0a0a0c; /* gelap biar loading tidak silau */
      overflow: hidden;
    }
    #appFrame {
      border: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* ikut toolbar browser HP */
      display: block;
      position: fixed;
      inset: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      background: #0a0a0c;
      z-index: 2;
      transition: opacity .3s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid rgba(45,212,191,.25);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: sp 1s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading"><div class="spin"></div><span>Memuat HANAN.UANG…</span></div>

  <!-- ▶ URL Web App Apps Script milik HANAN (Execute as: Me / Anyone) -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz1WzpOaBwo5XSTg1Obmd1GC5p5RjbdSK6VRfH-cFbOJE22_khgc4ChgyY1_9Fo11XD3g/exec"
    title="HANAN.UANG"
    allow="clipboard-write"></iframe>

  <script>
    // ===== PWA shell (service worker; manifest + ikon sudah file asli di <head> agar iOS Safari terbaca) =====
    (function () {
      try {
        // Service worker hanya aktif saat di-hosting statis (GitHub Pages) — aman gagal diam
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
          navigator.serviceWorker.register('service-worker.js').catch(function () {});
        }
      } catch (e) {}

      // Hilangkan layar loading begitu iframe selesai
      var fr = document.getElementById('appFrame');
      fr.addEventListener('load', function () {
        document.getElementById('loading').classList.add('hide');
      });
      // Fallback: matikan loading maksimal 8 detik walau event tak terpicu
      setTimeout(function () { document.getElementById('loading').classList.add('hide'); }, 8000);
    })();
  </script>

</body>
</html>
