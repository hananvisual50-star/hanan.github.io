<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>HANAN.UANG — Keuangan Pribadi</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0a0a0c; /* gelap biar loading tidak silau */
      overflow: hidden;
    }
    #appFrame {
      border: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* ikut toolbar browser HP */
      display: block;
      position: fixed;
      inset: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      background: #0a0a0c;
      z-index: 2;
      transition: opacity .3s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid rgba(45,212,191,.25);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: sp 1s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading"><div class="spin"></div><span>Memuat HANAN.UANG…</span></div>

  <!-- ▶ URL Web App Apps Script milik HANAN (Execute as: Me / Anyone) -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwszlqmz78Zk0_RFIcecjllSocs8ddKTx77s3KpJqcT7H4I3K3q-Q_20aryaLIv7-J_mQ/exec"
    title="HANAN.UANG"
    allow="clipboard-write"></iframe>

  <script>
    // ===== PWA shell (manifest + icon + service worker di halaman shell) =====
    (function () {
      try {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#10b981"/><text x="256" y="345" font-family="Arial,sans-serif" font-size="270" font-weight="bold" fill="#06251f" text-anchor="middle">H</text></svg>';
        var icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
        var man = {
          name: 'HANAN.UANG — Keuangan Pribadi',
          short_name: 'HANAN.UANG',
          start_url: '.',
          scope: '.',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#0a0a0c',
          theme_color: '#0a0a0c',
          lang: 'id',
          icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }]
        };
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man));
        document.head.appendChild(l);

        var m1 = document.createElement('meta'); m1.name = 'apple-mobile-web-app-capable'; m1.content = 'yes';
        var m2 = document.createElement('meta'); m2.name = 'apple-mobile-web-app-status-bar-style'; m2.content = 'black-translucent';
        var m3 = document.createElement('meta'); m3.name = 'apple-mobile-web-app-title'; m3.content = 'HANAN.UANG';
        document.head.appendChild(m1); document.head.appendChild(m2); document.head.appendChild(m3);
        var ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; ati.href = icon;
        document.head.appendChild(ati);

        // Service worker hanya aktif saat di-hosting statis (GitHub Pages) — aman gagal diam
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('service-worker.js').catch(function () {});
        }
      } catch (e) {}

      // Hilangkan layar loading begitu iframe selesai
      var fr = document.getElementById('appFrame');
      fr.addEventListener('load', function () {
        document.getElementById('loading').classList.add('hide');
      });
      // Fallback: matikan loading maksimal 8 detik walau event tak terpicu
      setTimeout(function () { document.getElementById('loading').classList.add('hide'); }, 8000);
    })();
  </script>

</body>
</html>
